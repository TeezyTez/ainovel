<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    body{--violet:#8b809f;--teal:#7a9c9c;--middle:#8c929f;--core:#706982}
    body[data-theme=dark]{--violet:#b9a9d2;--teal:#92c4c4;--middle:#a8b4ca;--core:#d1c5df}
    .universe-stage{position:relative;width:100%;height:100vh;overflow:hidden;isolation:isolate}
    .universe-art{position:absolute;right:6%;top:calc(50% - 135px);width:min(34vw,440px);height:320px;pointer-events:none}
    .universe-canvas,.universe-still{position:absolute;inset:0;width:100%;height:100%}
    .universe-canvas{opacity:0;transition:opacity 500ms ease}
    .universe-still{display:grid;place-items:center;transition:opacity 500ms ease}
    .universe-still svg{width:100%;height:100%;overflow:visible}
    .world-surface{fill:currentColor;fill-opacity:.025;stroke:currentColor;stroke-opacity:.22;stroke-width:.7}
    .world-contours{fill:none;stroke:currentColor;stroke-opacity:.24;stroke-width:.55}
    .world-rim{fill:none;stroke:currentColor;stroke-opacity:.7;stroke-width:.8}
    .world-core{fill:var(--core);fill-opacity:.68}
    .thread{fill:none;stroke:url(#thread-spectrum);stroke-width:1;stroke-linecap:round;opacity:.7}
    .thread-branch{stroke-width:.75;opacity:.33}
    [data-scene-ready=true] .universe-canvas{opacity:1}
    [data-scene-ready=true] .universe-still{opacity:0}
    @media(max-width:800px) and (min-width:621px){
      .universe-art{right:4%;top:420px;width:min(46vw,330px);height:220px}
    }
    @media(max-width:620px){
      .universe-art{right:auto;left:50%;top:480px;transform:translateX(-50%);width:min(86%,350px);height:230px}
    }
    @media(prefers-reduced-motion:reduce){.universe-canvas,.universe-still{transition:none}}
    body.reduce-motion .universe-canvas,body.reduce-motion .universe-still{transition:none}
    @media(forced-colors:active){.universe-art{display:none}}
  </style>
</head>

  <script type="module">
    import {createUniverseMotion} from './universe-motion.js?v=20261019-parallel';
    let progress=0;
    const stage=document.querySelector('[data-universe-stage]');
    const motion=createUniverseMotion({load:async()=>{
      const module=await import('./universe-scene.js?v=20261019-parallel');
      return {createUniverseScene(args){
        const scene=module.createUniverseScene(args);
        return {...scene,draw(params){scene.draw({...params,progress});}};
      }};
    }});
    motion.mount();
    addEventListener('message',event=>{
      if(event.source!==parent||event.origin!==location.origin)return;
      let data;
      try{data=JSON.parse(event.data);}catch{return;}
      if(!data||typeof data!=='object')return;
      if(data.type==='elselife-scene'){
        const theme=data.dark?'dark':'light';
        if(document.body.dataset.theme!==theme)document.body.dataset.theme=theme;
        const reduced=Boolean(data.reduced);
        if(document.body.classList.contains('reduce-motion')!==reduced)document.body.classList.toggle('reduce-motion',reduced);
        progress=Number.isFinite(data.progress)?data.progress:0;
        motion.setPaused(Boolean(data.paused));
      }
      if(data.type==='elselife-pointer')stage.dispatchEvent(new PointerEvent('pointermove',{clientX:data.x,clientY:data.y,pointerType:'mouse'}));
      if(data.type==='elselife-pointer-exit')stage.dispatchEvent(new PointerEvent('pointerleave'));
      if(data.type==='elselife-dispose')motion.destroy();
    });
    addEventListener('pagehide',()=>motion.destroy());
  </script>
